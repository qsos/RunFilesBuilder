name: Make NaiLink Official Installer

on:
  workflow_dispatch:

jobs:
  make-run:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y makeself curl

      - name: Prepare install.sh
        run: |
          mkdir -p build
          cat > build/install.sh << 'EOF'
          #!/bin/sh
          echo "正在下载并执行 NaiLink 官方安装脚本..."
          # 直接执行你提供的官方命令
          nl=$(uclient-fetch -O- https://slobys.github.io/NaiLink/install.sh) && sh -c "${nl:?下载为空}" -- --menu
          echo "NaiLink 安装流程已启动。"
          EOF
          chmod +x build/install.sh

      - name: Package as .run file
        id: pack
        run: |
          mkdir -p output
          VERSION="0.6.75"
          cd build
          makeself . "../output/NaiLink_Official_x86_64_${VERSION}.run" \
            "NaiLink Official Installer v${VERSION}" \
            ./install.sh
          cd ..
          ls -lh output/

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "NaiLink_Official_v${{ steps.pack.outputs.version }}"
          name: "NaiLink Official v${{ steps.pack.outputs.version }}"
          files: output/*.run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
