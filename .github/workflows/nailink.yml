name: Make NaiLink Complete run files

on:
  workflow_dispatch:

jobs:
  make-run:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y makeself curl jq

      - name: Get NaiLink x86_64 IPK Assets
        id: get_assets
        run: |
          ASSETS=$(curl -s https://api.github.com/repos/slobys/NaiLink/releases/tags/openwrt-v0.6.75)
          
          # 1. 筛选核心包：只要 x86_64 的 .ipk
          CORE_URL=$(echo "$ASSETS" | jq -r '.assets[] | select(.name | test("x86_64") and test("\\.ipk$")) | .browser_download_url' | head -n 1)
          
          # 2. 筛选 LuCI 界面包：兼容 daed 或 nailink 命名
          LUCI_URL=$(echo "$ASSETS" | jq -r '.assets[] | select((test("luci-app-daed") or test("luci-app-nailink")) and test("\\.ipk$")) | .browser_download_url' | head -n 1)
          
          # 3. 筛选中文语言包
          I18N_URL=$(echo "$ASSETS" | jq -r '.assets[] | select((test("luci-i18n-daed-zh-cn") or test("luci-i18n-nailink-zh-cn")) and test("\\.ipk$")) | .browser_download_url' | head -n 1)

          if [ -z "$CORE_URL" ]; then
            echo "错误：未能找到 x86_64 核心 IPK"
            exit 1
          fi

          echo "core_url=$CORE_URL" >> $GITHUB_OUTPUT
          echo "luci_url=$LUCI_URL" >> $GITHUB_OUTPUT
          echo "i18n_url=$I18N_URL" >> $GITHUB_OUTPUT

      - name: Download IPK files
        run: |
          mkdir -p build
          wget -O "build/nailink-core.ipk" "${{ steps.get_assets.outputs.core_url }}"
          
          if [ -n "${{ steps.get_assets.outputs.luci_url }}" ] && [ "${{ steps.get_assets.outputs.luci_url }}" != "null" ]; then
            wget -O "build/luci-app.ipk" "${{ steps.get_assets.outputs.luci_url }}"
          else
            echo "警告：未找到独立的 LuCI 界面包，主包可能已包含界面。"
          fi
          
          if [ -n "${{ steps.get_assets.outputs.i18n_url }}" ] && [ "${{ steps.get_assets.outputs.i18n_url }}" != "null" ]; then
            wget -O "build/luci-i18n-zh-cn.ipk" "${{ steps.get_assets.outputs.i18n_url }}"
          fi
          ls -lh build/

      - name: Prepare install.sh
        run: |
          cat > build/install.sh << 'EOF'
          #!/bin/sh
          echo "正在更新软件包列表..."
          opkg update
          echo "正在安装 NaiLink 及其界面..."
          opkg install ./*.ipk
          echo "安装完成。正在重启 LuCI 服务..."
          /etc/init.d/uhttpd restart
          EOF
          chmod +x build/install.sh

      - name: Package as .run file
        id: pack
        run: |
          mkdir -p output
          VERSION="0.6.75"
          cd build
          makeself . "../output/NaiLink_Complete_x86_64_${VERSION}.run" \
            "NaiLink Complete Installer (Core + LuCI) v${VERSION}" \
            ./install.sh
          cd ..
          ls -lh output/

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "NaiLink_Complete_v${{ steps.pack.outputs.version }}"
          name: "NaiLink Complete v${{ steps.pack.outputs.version }}"
          files: output/*.run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
